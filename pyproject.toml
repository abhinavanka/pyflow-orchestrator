[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflow-orchestrator"
version = "0.1.0"
description = "Workflow orchestration platform with DAG scheduling, retries, backfills and a monitoring console"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["pyflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
